ses from gross sales.",example:"With ₹1,500 in daily vegetable sales minus ₹900 for mandi stock and ₹120 for stall fee and ice, your net operating cash from the stall is ₹480 per day (before ₹280 household groceries)."},"hi-IN":{explanation:"शुद्ध व्यापारिक बचत (Net operating cash) वह असली रकम है जो रोज़ की कुल बिक्री में से मंडी के माल (₹900) और ठेले के संचालन खर्च (₹120) को निकालने के बाद आपके हाथ में बचती है।",example:"₹1,500 रोज़ की बिक्री में से ₹900 माल और ₹120 पर्ची-बर्फ घटाने के बाद व्यापार से ₹480 रोज़ बचते हैं, जिससे घर का ₹280 राशन चलता है और ₹200 शुद्ध बचत जुड़ती है।"},"pa-IN":{explanation:"ਸ਼ੁੱਧ ਕਾਰੋਬਾਰੀ ਬੱਚਤ (Net operating cash) ਉਹ ਅਸਲ ਰਕਮ ਹੈ ਜੋ ਰੋਜ਼ਾਨਾ ਵਿਕਰੀ ਵਿੱਚੋਂ ਮੰਡੀ ਦੇ ਮਾਲ (₹900) ਅਤੇ ਰੇਹੜੀ ਦੇ ਖਰਚੇ (₹120) ਕੱਢਣ ਤੋਂ ਬਾਅਦ ਬਚਦੀ ਹੈ।",example:"₹1,500 ਵਿਕਰੀ ਵਿੱਚੋਂ ₹900 ਸਟਾਕ ਅਤੇ ₹120 ਪਰਚੀ-ਬਰਫ਼ ਕੱਢ ਕੇ ₹480 ਬਚਦੇ ਹਨ, ਜਿਸ ਵਿੱਚੋਂ ₹280 ਘਰ ਦਾ ਰਾਸ਼ਨ ਚੱਲਦਾ ਹੈ।"}},supplier_credit:{"en-IN":{explanation:"Supplier credit is stock or goods you take from a wholesaler today with a promise to pay a lump sum on an agreed date. Because it falls due all at once, it can create a sudden dip in your cash balance.",example:`In your twin, the ₹2,200 wholesale potato and onion settlement due on ${d} pulls down your cash buffer in a single day.`},"hi-IN":{explanation:"सप्लायर या आढ़ती उधार (Supplier credit) वह माल है जो आप आज लेते हैं और जिसका इकट्ठा भुगतान कुछ दिनों बाद तय तारीख को करना होता है। एक साथ बड़ी रकम जाने से उस दिन नकदी अचानक गिर सकती है।",example:"आपके विवरण में ₹2,200 का आढ़ती भुगतान एक साथ आने पर नकद शेष एक ही दिन में तेज़ी से नीचे आता है।"},"pa-IN":{explanation:"ਸਪਲਾਇਰ ਉਧਾਰ (Supplier credit) ਉਹ ਮਾਲ ਹੈ ਜੋ ਤੁਸੀਂ ਅੱਜ ਲੈਂਦੇ ਹੋ ਅਤੇ ਜਿਸ ਦਾ ਇਕੱਠਾ ਭੁਗਤਾਨ ਤੈਅ ਤਾਰੀਖ ਨੂੰ ਕਰਨਾ ਹੁੰਦਾ ਹੈ।",example:"ਤੁਹਾਡੇ ਟਵਿਨ ਵਿੱਚ ₹2,200 ਦਾ ਆੜ੍ਹਤੀ ਭੁਗਤਾਨ ਆਉਣ 'ਤੇ ਨਕਦ ਬਕਾਇਆ ਇੱਕੋ ਦਿਨ ਵਿੱਚ ਘੱਟ ਜਾਂਦਾ ਹੈ।"}},debt_repayment:{"en-IN":{explanation:"Debt repayment is a fixed loan instalment (kist) that must be paid on its due schedule whether business sales are strong or weak that week.",example:"Your ₹700 weekly loan instalment comes due every 7 days. When combined with a supplier payment or monthly rent in the same week, it increases cash stress."},"hi-IN":{explanation:"ऋण किस्त (Debt repayment) वह तय भुगतान है जो हर हफ्ते या महीने समय पर देना ही पड़ता है, चाहे उस हफ्ते बिक्री अच्छी हुई हो या कम।",example:"हर हफ्ते जाने वाली ₹700 की किस्त जब सप्लायर के ₹2,200 या महीने के ₹1,800 किराये के आस-पास पड़ती है, तो नकदी पर दबाव बढ़ जाता है।"},"pa-IN":{explanation:"ਕਰਜ਼ੇ ਦੀ ਕਿਸ਼ਤ (Debt repayment) ਉਹ ਤੈਅ ਭੁਗਤਾਨ ਹੈ ਜੋ ਹਰ ਹਫ਼ਤੇ ਜਾਂ ਮਹੀਨੇ ਸਮੇਂ ਸਿਰ ਦੇਣਾ ਪੈਂਦਾ ਹੈ, ਭਾਵੇਂ ਵਿਕਰੀ ਘੱਟ ਹੋਵੇ ਜਾਂ ਵੱਧ।",example:"ਹਰ ਹਫ਼ਤੇ ਜਾਣ ਵਾਲੀ ₹700 ਦੀ ਕਿਸ਼ਤ ਜਦੋਂ ਸਪਲਾਇਰ ਭੁਗਤਾਨ ਜਾਂ ਕਿਰਾਏ ਦੇ ਨੇੜੇ ਆਉਂਦੀ ਹੈ ਤਾਂ ਨਕਦੀ 'ਤੇ ਦਬਾਅ ਵਧਦਾ ਹੈ।"}},minimum_reserve:{"en-IN":{explanation:"Your minimum safety reserve is the emergency cash cushion you aim to keep untouched so that a few slow days or a minor illness never forces you into high-interest daily borrowing.",example:`You set ${f} as your safety reserve. Whenever LUMO projects your closing balance dropping below ${f}, it flags a reserve breach early.`},"hi-IN":{explanation:"न्यूनतम सुरक्षा रिज़र्व (Minimum reserve) वह आपातकालीन नकद बफर है जिसे आप हमेशा अलग रखना चाहते हैं ताकि बारिश, बीमारी या मंदी के दिनों में महँगे ब्याज पर उधार न लेना पड़े।",example:`आपने ${f} को अपना सुरक्षा रिज़र्व रखा है। जब भी अनुमानित नकद शेष ${f} से नीचे जाता है, LUMO पहले से चेतावनी देता है।`},"pa-IN":{explanation:"ਘੱਟੋ-ਘੱਟ ਸੁਰੱਖਿਅਤ ਰਿਜ਼ਰਵ (Minimum reserve) ਉਹ ਐਮਰਜੈਂਸੀ ਨਕਦ ਬਫਰ ਹੈ ਜਿਸ ਨੂੰ ਤੁਸੀਂ ਹਮੇਸ਼ਾ ਵੱਖ ਰੱਖਣਾ ਚਾਹੁੰਦੇ ਹੋ ਤਾਂ ਜੋ ਮੰਦੀ ਦੇ ਦਿਨਾਂ ਵਿੱਚ ਮਹਿੰਗਾ ਉਧਾਰ ਨਾ ਲੈਣਾ ਪਵੇ।",example:`ਤੁਸੀਂ ${f} ਆਪਣਾ ਸੁਰੱਖਿਅਤ ਰਿਜ਼ਰਵ ਰੱਖਿਆ ਹੈ। ਜਦੋਂ ਵੀ ਅਨੁਮਾਨਿਤ ਨਕਦ ${f} ਤੋਂ ਹੇਠਾਂ ਜਾਂਦਾ ਹੈ, LUMO ਅਗਾਊਂ ਚੇਤਾਵਨੀ ਦਿੰਦਾ ਹੈ।`}},projected_cash_shortfall:{"en-IN":{explanation:"A projected cash shortfall measures how far your lowest forecasted cash balance drops below your minimum safety reserve (or below ₹0) if current inflows and outflows continue as scheduled.",example:`Under the current scenario (${o.scenario_status??"reserve_breach"}), your lowest balance around ${d} is ${l} below your ${f} safety reserve.`},"hi-IN":{explanation:"अनुमानित नकदी की कमी (Projected cash shortfall) बताती है कि आने वाले दिनों में आपका सबसे कम नकद शेष आपके सुरक्षा रिज़र्व (${reserveStr}) से कितना नीचे जा सकता है।",example:`वर्तमान अनुमान में ${d} के आस-पास आपका नकद शेष आपके ${f} सुरक्षा रिज़र्व से ${l} कम पड़ रहा है—ताकि आप समय रहते आढ़ती से किस्त बाँटने या खर्च समायोजित करने का निर्णय ले सकें।`},"pa-IN":{explanation:"ਅਨੁਮਾਨਿਤ ਨਕਦੀ ਦੀ ਘਾਟ (Projected cash shortfall) ਦੱਸਦੀ ਹੈ ਕਿ ਆਉਣ ਵਾਲੇ ਦਿਨਾਂ ਵਿੱਚ ਤੁਹਾਡਾ ਸਭ ਤੋਂ ਘੱਟ ਨਕਦ ਬਕਾਇਆ ਤੁਹਾਡੇ ਸੁਰੱਖਿਅਤ ਰਿਜ਼ਰਵ ਤੋਂ ਕਿੰਨਾ ਹੇਠਾਂ ਜਾ ਸਕਦਾ ਹੈ।",example:`ਮੌਜੂਦਾ ਅਨੁਮਾਨ ਵਿੱਚ ${d} ਦੇ ਨੇੜੇ ਤੁਹਾਡਾ ਨਕਦ ਬਕਾਇਆ ਤੁਹਾਡੇ ${f} ਸੁਰੱਖਿਅਤ ਰਿਜ਼ਰਵ ਤੋਂ ${l} ਘੱਟ ਰਿਹਾ ਹੈ।`}},income_shock:{"en-IN":{explanation:"An income shock is a temporary drop in your daily business sales—caused by heavy rain, heatwave, illness, or local market disruption—while fixed obligations like rent, supplier dues, and loan instalments still have to be paid.",example:"When daily vegetable sales fall by 30% (from ₹1,500 to ₹1,050) for 14 days, you collect ₹450 less each day—a ₹6,300 cumulative revenue drop over two weeks."},"hi-IN":{explanation:"आय का झटका (Income shock) का मतलब है बारिश, बीमारी या बाज़ार बंद होने के कारण कुछ दिनों के लिए रोज़ की बिक्री का अचानक घट जाना—जबकि किराया, किस्त और सप्लायर का पैसा तय समय पर ही देना होता है।",example:"जब 14 दिनों के लिए बिक्री 30% घटती है (₹1,500 से घटकर ₹1,050 रोज़), तो हर दिन ₹450 कम आते हैं—यानी 14 दिनों में कुल ₹6,300 की बिक्री कम हो जाती है।"},"pa-IN":{explanation:"ਆਮਦਨ ਦਾ ਝਟਕਾ (Income shock) ਦਾ ਮਤਲਬ ਹੈ ਮੀਂਹ, ਬਿਮਾਰੀ ਜਾਂ ਬਾਜ਼ਾਰ ਬੰਦ ਹੋਣ ਕਾਰਨ ਕੁਝ ਦਿਨਾਂ ਲਈ ਰੋਜ਼ਾਨਾ ਵਿਕਰੀ ਦਾ ਅਚਾਨਕ ਘੱਟ ਜਾਣਾ, ਜਦੋਂ ਕਿ ਕਿਰਾਇਆ ਅਤੇ ਕਿਸ਼ਤਾਂ ਤੈਅ ਸਮੇਂ 'ਤੇ ਦੇਣੀਆਂ ਪੈਂਦੀਆਂ ਹਨ।",example:"ਜਦੋਂ 14 ਦਿਨਾਂ ਲਈ ਵਿਕਰੀ 30% ਘੱਟਦੀ ਹੈ (₹1,500 ਤੋਂ ₹1,050 ਰੋਜ਼), ਤਾਂ 14 ਦਿਨਾਂ ਵਿੱਚ ਕੁੱਲ ₹6,300 ਘੱਟ ਆਉਂਦੇ ਹਨ।"}}},m=h[a.term_key]?.[s]??h[a.term_key]?.["en-IN"]??h.projected_cash_shortfall[s]??h.projected_cash_shortfall["en-IN
